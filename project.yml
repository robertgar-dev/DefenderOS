# XcodeGen project spec. Install: `brew install xcodegen`. Run: `xcodegen generate`.
# This file is the diffable source of truth — never hand-edit the .xcodeproj.
#
# Fill in your Apple Developer Team ID before building on a physical device.
# Simulator + CI builds run unsigned (CI passes CODE_SIGNING_ALLOWED=NO).
#
# The widget extension target was removed for the MVP build track — it returns
# with the Backlog (decision 0008). Less to sign, less to break, faster to live.

name: DefenderOS
options:
  bundleIdPrefix: com.garfinkle
  deploymentTarget:
    iOS: "17.0"

targets:
  DefenderOS:
    type: application
    platform: iOS
    sources:
      - path: DefenderOS
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garfinkle.defenderos
        INFOPLIST_FILE: DefenderOS/Resources/Info.plist
        DEVELOPMENT_TEAM: "" # your Team ID, for device builds only
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: DefenderOS/Resources/DefenderOS.entitlements
      # File is hand-authored (docs/AUDIT.md fix, red flag #5) rather than
      # generated from a `properties:` block — removes a dependency on
      # XcodeGen behavior that was asserted but never verified in this repo.

  DefenderOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DefenderOSTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.garfinkle.defenderos.tests
    dependencies:
      - target: DefenderOS

schemes:
  DefenderOS:
    build:
      targets:
        DefenderOS: all
    test:
      targets:
        - DefenderOSTests
    run:
      config: Debug
